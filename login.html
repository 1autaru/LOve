<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Noi — Autentificare</title>
  <meta name="theme-color" content="#faf6f3" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <script src="js/pwa.js" defer></script>
  <link rel="stylesheet" href="css/settings.css" />
  <link rel="stylesheet" href="css/playful.css" />
  <script src="js/appearance.js"></script>
</head>
<body>
  <div id="offline-banner" class="offline-banner">Ești offline — te poți loga doar cu internet</div>

  <main class="auth-screen">
    <div class="auth-card">
      <div class="card">
        <p class="auth-logo">Noi</p>

        <svg class="thread" viewBox="0 0 200 14" preserveAspectRatio="none" aria-hidden="true">
          <path d="M0,7 Q50,-3 100,7 T200,7" />
        </svg>

        <h1>Bine ai revenit</h1>
        <p class="text-muted" style="margin-top: 6px; margin-bottom: 24px;">
          Intră cu contul tău pentru a continua.
        </p>

        <div id="error-notice" class="notice notice-error" hidden></div>

        <form id="login-form" class="stack" style="text-align: left;">
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required />
          </div>
          <div class="field" style="margin-bottom: 8px;">
            <label for="password">Parolă</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required />
          </div>

          <button type="submit" id="submit-btn" class="btn btn-primary">
            <span id="submit-label">Intră</span>
          </button>
        </form>
      </div>
    </div>
  </main>

  <script type="module">
    import { signIn, getSession } from "./js/auth.js";
    import { initOfflineBanner } from "./js/offline.js";

    initOfflineBanner();

    // Dacă există deja o sesiune validă, sari direct în aplicație.
    getSession().then((session) => {
      if (session) window.location.href = "app.html";
    });

    const form = document.getElementById("login-form");
    const errorNotice = document.getElementById("error-notice");
    const submitBtn = document.getElementById("submit-btn");
    const submitLabel = document.getElementById("submit-label");

    function showError(message) {
      errorNotice.textContent = message;
      errorNotice.hidden = false;
    }

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      submitLabel.textContent = isLoading ? "Se conectează…" : "Intră";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorNotice.hidden = true;

      if (!navigator.onLine) {
        showError("Nu ai conexiune la internet. Verifică rețeaua și încearcă din nou.");
        return;
      }

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      setLoading(true);
      const { error } = await signIn(email, password);
      setLoading(false);

      if (error) {
        if (error.message.includes("Invalid login credentials")) {
          showError("Email sau parolă greșită.");
        } else if (error.message.toLowerCase().includes("fetch")) {
          showError("Nu am putut contacta serverul. Verifică internetul.");
        } else {
          showError("A apărut o eroare. Încearcă din nou.");
        }
        return;
      }

      window.location.href = "app.html";
    });
  </script>
</body>
</html>
